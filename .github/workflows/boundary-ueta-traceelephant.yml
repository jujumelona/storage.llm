name: Boundary-UETA TraceElephant generalization falsification

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cueta_traceelephant_eval.py'
      - 'experiments/boundary_ueta_traceelephant.py'
      - '.github/workflows/boundary-ueta-traceelephant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire TraceElephant
        run: |
          python -m pip install -q 'huggingface_hub>=0.28'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='TraceElephant/TraceElephant',repo_type='dataset',local_dir='/tmp/TraceElephantData')
          PY
      - name: Run Boundary-UETA
        run: |
          set -euxo pipefail
          rm -rf boundary_ueta_results
          python -u experiments/boundary_ueta_traceelephant.py --data /tmp/TraceElephantData --out boundary_ueta_results | tee boundary_ueta_results.log
          cp boundary_ueta_results.log boundary_ueta_results/run.log
          cp experiments/boundary_ueta_traceelephant.py boundary_ueta_results/
          cp experiments/cueta_traceelephant_eval.py boundary_ueta_results/
          cat boundary_ueta_results/summary.json
      - name: Package
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive('BOUNDARY_UETA_TRACEELEPHANT_RESULTS','zip','boundary_ueta_results')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BOUNDARY_UETA_TRACEELEPHANT_RESULTS
          path: |
            BOUNDARY_UETA_TRACEELEPHANT_RESULTS.zip
            boundary_ueta_results/
          retention-days: 7
