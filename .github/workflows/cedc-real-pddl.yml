name: CEDC real PDDL solve and replay

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/real_pddl_plan_replay.py'
      - '.github/workflows/cedc-real-pddl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-plan-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: cedc-real-pddl-validation
          fetch-depth: 1

      - name: Set up result directory
        run: mkdir -p real_pddl_results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install parser, planner and validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pddlpy==1.2.1' 'unified-planning==1.3.0' 'up-fast-downward==0.5.2'
          python -m pip freeze > real_pddl_results/parser_environment.txt

      - name: Clone exact public SIFT revision
        run: |
          git clone https://github.com/JonasGoesgens/SIFT.git public_sift
          git -C public_sift checkout 0f4518ffa609322a24521609f80d70728f07ac09
          test "$(git -C public_sift rev-parse HEAD)" = "0f4518ffa609322a24521609f80d70728f07ac09"

      - name: Solve, validate and replay exact Table 1 problems
        run: |
          python experiments/real_pddl_plan_replay.py public_sift real_pddl_results | tee real_pddl_results/run.log

      - name: Record exact source hashes
        if: always()
        run: |
          if [ -d public_sift/pddl_files ]; then
            for f in \
              pddl_files/gripper/gripper.pddl pddl_files/gripper/gripper_8_3.pddl \
              pddl_files/ferry/ferry.pddl pddl_files/ferry/ferry-6-5.pddl \
              pddl_files/delivery/delivery.pddl pddl_files/delivery/delivery-3-3-3-2.pddl \
              pddl_files/hanoi/hanoi.pddl pddl_files/hanoi/hanoi-3-10.pddl \
              pddl_files/npuzzle/npuzzle.pddl pddl_files/npuzzle/npuzzle-4-4.pddl \
              pddl_files/sokoban/sokoban.pddl pddl_files/sokoban/sokoban-5-5_3.pddl; do
              sha256sum "public_sift/$f"
            done > real_pddl_results/PDDL_SHA256SUMS.txt
          fi
          sha256sum experiments/real_pddl_plan_replay.py > real_pddl_results/VALIDATOR_SHA256.txt

      - name: Persist machine-readable result on validation branch
        if: success()
        run: |
          mkdir -p experiments/real_pddl_results
          cp real_pddl_results/REAL_PDDL_PLAN_REPLAY.json experiments/real_pddl_results/
          cp real_pddl_results/REAL_PDDL_PLAN_REPLAY.md experiments/real_pddl_results/
          cp real_pddl_results/PDDL_SHA256SUMS.txt experiments/real_pddl_results/
          cp real_pddl_results/VALIDATOR_SHA256.txt experiments/real_pddl_results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/real_pddl_results
          git commit -m 'Record exact real PDDL validation results [skip ci]' || true
          git push origin HEAD:cedc-real-pddl-validation

      - name: Upload exact real PDDL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cedc-real-pddl-plan-replay
          path: real_pddl_results
          if-no-files-found: error
          retention-days: 30
