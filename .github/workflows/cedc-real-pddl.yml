name: CEDC real PDDL trace schema equivalence

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/real_pddl_trace_schema_equivalence.py'
      - 'experiments/real_pddl_trace_schema_equivalence_v2.py'
      - '.github/workflows/cedc-real-pddl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-schema-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Run trace-only small-to-large schema learner
        shell: bash
        run: |
          set -u
          mkdir -p real_pddl_schema_results
          python3 -m pip install -q 'pddlpy==1.2.1' 'unified-planning==1.3.0' 'up-fast-downward==0.5.2' > /tmp/pip.log 2>&1
          python3 -m pip freeze > real_pddl_schema_results/environment.txt
          git clone -q https://github.com/JonasGoesgens/SIFT.git public_sift
          git -C public_sift checkout -q 0f4518ffa609322a24521609f80d70728f07ac09
          test "$(git -C public_sift rev-parse HEAD)" = "0f4518ffa609322a24521609f80d70728f07ac09"
          base='https://raw.githubusercontent.com/jujumelona/storage.llm/cedc-real-pddl-validation/experiments'
          curl -fsSL "$base/real_pddl_trace_schema_equivalence.py" -o real_pddl_trace_schema_equivalence.py
          curl -fsSL "$base/real_pddl_trace_schema_equivalence_v2.py" -o real_pddl_trace_schema_equivalence_v2.py
          set +e
          python3 real_pddl_trace_schema_equivalence_v2.py public_sift real_pddl_schema_results > real_pddl_schema_results/run.log 2>&1
          rc=$?
          set -e
          if [ -f real_pddl_schema_results/REAL_PDDL_TRACE_SCHEMA_EQUIVALENCE.json ]; then
            python3 - <<'PY'
          import json
          r = json.load(open('real_pddl_schema_results/REAL_PDDL_TRACE_SCHEMA_EQUIVALENCE.json', encoding='utf-8'))
          print('CEDC_SCHEMA_SUMMARY=' + json.dumps(r['summary'], sort_keys=True, separators=(',', ':')))
          for name, case in sorted(r['cases'].items()):
              h = case.get('heldout', {})
              e = case.get('effect_audit', {})
              print('CEDC_SCHEMA_CASE=' + json.dumps({
                  'domain': name,
                  'pass': case.get('pass', False),
                  'executable_effect_exact': e.get('all_exact'),
                  'raw_syntactic_effect_exact': e.get('raw_syntactic_exact'),
                  'inapplicable_partitions': e.get('semantically_inapplicable_partitions'),
                  'attempts': h.get('total', 0),
                  'fp': h.get('fp', 0),
                  'fn': h.get('fn', 0),
                  'abstain': h.get('abstain', 0),
                  'successor_exact': h.get('successor_exact', 0),
                  'successor_tested': h.get('successor_tested', 0),
                  'rollout': case.get('rollout', {}).get('pass'),
                  'rollout_steps': case.get('rollout', {}).get('plan_length'),
                  'error': case.get('error'),
              }, sort_keys=True, separators=(',', ':')))
          PY
          else
            echo 'CEDC_SCHEMA_SUMMARY=MISSING'
          fi
          tail -n 100 real_pddl_schema_results/run.log || true
          exit "$rc"

      - name: Record hashes
        if: always()
        run: |
          sha256sum real_pddl_trace_schema_equivalence.py real_pddl_trace_schema_equivalence_v2.py > real_pddl_schema_results/VALIDATOR_SHA256.txt || true
          git -C public_sift rev-parse HEAD > real_pddl_schema_results/SIFT_COMMIT.txt || true

      - name: Upload schema equivalence results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cedc-real-pddl-trace-schema-equivalence-v2
          path: real_pddl_schema_results
          if-no-files-found: error
          retention-days: 30
