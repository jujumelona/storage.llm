name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  smoke-test:
    name: Smoke Test (JSONParser)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgtest-dev

      - name: Build JSON parser smoke test directly
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -I. \
            moe_engine/tests/test_json_parser.cpp \
            -lgtest -lgtest_main -pthread \
            -o test_json_parser

      - name: Run JSON parser smoke test
        run: ./test_json_parser

      - name: Write final summary
        if: always()
        shell: bash
        run: |
          cat > ci-summary.md <<'EOF'
          # CI Summary

          Copy this block into ChatGPT for follow-up fixes.

          | Check | Result |
          | --- | --- |
          | JSONParser direct smoke test | ${{ job.status }} |

          This workflow intentionally bypasses the full CMake project and runs one fast regression test:
          `g++ ... moe_engine/tests/test_json_parser.cpp && ./test_json_parser`.
          EOF
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-summary.md

      - name: Upload CI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ci-summary.md
