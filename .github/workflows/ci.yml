name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  jsonparser-smoke:
    name: JSONParser Smoke (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgtest-dev

      - name: Build JSON parser test directly
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic \
            -I. \
            moe_engine/tests/test_json_parser.cpp \
            -lgtest -lgtest_main -pthread \
            -o test_json_parser

      - name: Run JSON parser test
        run: ./test_json_parser

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whitespace formatting
        run: git diff --check
