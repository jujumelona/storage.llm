name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  module-verification:
    name: Module Verification (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev liburing-dev

      - name: Configure focused CMake build
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSTORAGELLM_BUILD_TESTS=ON
          -DSTORAGELLM_PPL_DIAG=OFF
          -DSTORAGELLM_ENABLE_NATIVE_OPTIMIZE=OFF
          -DSTORAGELLM_ENABLE_TVM_CODEGEN=OFF
          -DSTORAGELLM_ENABLE_CUDA=OFF
          -DSTORAGELLM_ENABLE_CUBLASLT=OFF
          -DSTORAGELLM_ENABLE_CUTLASS=OFF
          -DSTORAGELLM_ENABLE_ROCM=OFF
          -DSTORAGELLM_ENABLE_HIPBLASLT=OFF
          -DSTORAGELLM_ENABLE_CK=OFF
          -DSTORAGELLM_ENABLE_METAL=OFF
          -DSTORAGELLM_ENABLE_ONEDNN=OFF
          -DSTORAGELLM_ENABLE_VULKAN=OFF
          -DSTORAGELLM_ENABLE_OPENCL=OFF
          -DSTORAGELLM_ENABLE_CLBLAST=OFF

      - name: Build available focused module tests
        shell: bash
        run: |
          set -euo pipefail
          ninja -C build -t targets all | sed 's/:.*//' | sort -u > build/targets.txt
          echo "Available focused-related targets:"
          grep -E '^(test_json_parser|test_loader_manifest_examples|test_weight_contract_examples|test_ppl_math_contract_examples|test_ppl_diag_contract_examples|test_qkv_contract_examples|test_qkv_parity)$' build/targets.txt || true

          candidates=(
            test_json_parser
            test_loader_manifest_examples
            test_weight_contract_examples
            test_ppl_math_contract_examples
            test_ppl_diag_contract_examples
            test_qkv_contract_examples
            test_qkv_parity
          )
          selected=()
          for target in "${candidates[@]}"; do
            if grep -Fxq "${target}" build/targets.txt; then
              selected+=("${target}")
            else
              echo "Skipping unavailable target: ${target}"
            fi
          done
          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No focused test targets were generated by CMake. Dumping all targets:"
            cat build/targets.txt
            exit 1
          fi
          printf 'Selected test targets: %s\n' "${selected[*]}"
          cmake --build build --parallel 2 --target "${selected[@]}"

      - name: Run available focused module tests
        run: >
          ctest --test-dir build --output-on-failure --timeout 120
          -R '^(JSONParser|test_loader_manifest_examples|test_weight_contract_examples|test_ppl_math_contract_examples|test_ppl_diag_contract_examples|test_qkv_contract_examples|QKVParity)$'

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: module-verification-logs
          path: build/Testing/Temporary/

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check whitespace formatting
        run: git diff --check

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - module-verification
      - format-check
    if: always()

    steps:
      - name: Write final summary
        shell: bash
        run: |
          cat > ci-summary.md <<'EOF'
          # CI Summary

          Copy this block into ChatGPT for follow-up fixes.

          | Check | Result |
          | --- | --- |
          | module-verification | ${{ needs.module-verification.result }} |
          | format-check | ${{ needs.format-check.result }} |

          ## What this verifies

          - CMake configure with optional hardware backends disabled.
          - Available focused tests among JSON, loader, weight, PPL, and QKV contracts.
          - Missing optional test targets are skipped only after checking Ninja's real target graph.

          ## What this intentionally does not verify

          - Full Windows/macOS matrix.
          - Sanitizers.
          - Static analysis.
          - Real model/weight loading against large artifacts.
          EOF
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-summary.md

      - name: Upload CI summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ci-summary.md
