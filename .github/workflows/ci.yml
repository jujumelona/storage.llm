name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            cc: gcc-11
            cxx: g++-11
          - os: windows-latest
            cc: cl
            cxx: cl
          - os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build liburing-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja

      - name: Configure CMake
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSTORAGELLM_BUILD_TESTS=ON
          -DSTORAGELLM_PPL_DIAG=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/Testing/Temporary/

  sanitizers:
    name: Sanitizers (Ubuntu, ${{ matrix.sanitizer }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread, undefined]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build liburing-dev

      - name: Configure CMake with ${{ matrix.sanitizer }} sanitizer
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSTORAGELLM_BUILD_TESTS=ON \
            -DSTORAGELLM_ENABLE_SANITIZERS=ON \
            -DSTORAGELLM_SANITIZER_SET=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests with ${{ matrix.sanitizer }} sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1
          TSAN_OPTIONS: second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          git diff --check

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - sanitizers
      - format-check
    if: always()

    steps:
      - name: Write one-page CI summary
        shell: bash
        run: |
          cat > ci-summary.md <<'EOF'
          # CI Summary

          Copy this whole block into ChatGPT when asking for follow-up fixes.

          | Job group | Result |
          | --- | --- |
          | build-and-test | ${{ needs.build-and-test.result }} |
          | sanitizers | ${{ needs.sanitizers.result }} |
          | format-check | ${{ needs.format-check.result }} |

          ## Interpretation

          - `success`: all matrix entries in that group passed.
          - `failure`: at least one matrix entry failed. Open that failed job and copy the last failing compiler/test log section.
          - `cancelled` or `skipped`: the group did not complete normally.

          ## Current workflow shape

          - Static analysis is not part of PR CI.
          - Build/test runs on Ubuntu, Windows, and macOS in Debug and Release.
          - Sanitizers run on Ubuntu for address, thread, and undefined behavior.
          EOF

          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-summary.md

      - name: Upload CI summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ci-summary.md
