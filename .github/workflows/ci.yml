name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  engine-verification:
    name: Engine Verification (Ubuntu, ppl=${{ matrix.ppl_diag }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        ppl_diag: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgtest-dev liburing-dev
      - name: Configure engine build
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSTORAGELLM_BUILD_TESTS=ON
          -DSTORAGELLM_PPL_DIAG=${{ matrix.ppl_diag }}
          -DSTORAGELLM_ENABLE_NATIVE_OPTIMIZE=OFF
          -DSTORAGELLM_ENABLE_TVM_CODEGEN=OFF
          -DSTORAGELLM_ENABLE_CUDA=OFF
          -DSTORAGELLM_ENABLE_CUBLASLT=OFF
          -DSTORAGELLM_ENABLE_CUTLASS=OFF
          -DSTORAGELLM_ENABLE_ROCM=OFF
          -DSTORAGELLM_ENABLE_HIPBLASLT=OFF
          -DSTORAGELLM_ENABLE_CK=OFF
          -DSTORAGELLM_ENABLE_METAL=OFF
          -DSTORAGELLM_ENABLE_ONEDNN=OFF
          -DSTORAGELLM_ENABLE_VULKAN=OFF
          -DSTORAGELLM_ENABLE_OPENCL=OFF
          -DSTORAGELLM_ENABLE_CLBLAST=OFF
      - name: Build engine and all tests
        run: cmake --build build --parallel 2
      - name: Require expected tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N | tee build/ctest-list.txt
          required_tests=(
            BugFixes
            JSONParser
            PrefetchValidation
            QKVParity
            test_loader_manifest_examples
            test_qkv_contract_examples
            test_weight_contract_examples
            test_ppl_math_contract_examples
            test_ppl_diag_contract_examples
            test_engine_fixture_loading
          )
          for t in "${required_tests[@]}"; do
            grep -Eq "Test +#[0-9]+: ${t}$" build/ctest-list.txt || { echo "Missing required CTest: ${t}"; exit 1; }
          done
      - name: Run all CTest tests
        run: ctest --test-dir build --output-on-failure --timeout 180
      - name: Run engine probe runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          ./build/storagellm_probe --backend cpu --platform cpu
          ./build/storagellm_probe --qkv --backend cpu --platform cpu
      - name: Upload CTest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-verification-logs-ppl-${{ matrix.ppl_diag }}
          path: build/Testing/Temporary/

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [engine-verification, format-check]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo '# CI Summary' >> "$GITHUB_STEP_SUMMARY"
          echo '| Check | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| engine-verification | ${{ needs.engine-verification.result }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| format-check | ${{ needs.format-check.result }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This CI now requires PPL contract tests, the engine fixture loading test, and storagellm_probe in CPU and QKV modes.' >> "$GITHUB_STEP_SUMMARY"
