name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  smoke-test:
    name: Smoke Test (JSONParser)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtest-dev

      - name: Configure minimal build
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSTORAGELLM_BUILD_TESTS=ON
          -DSTORAGELLM_PPL_DIAG=OFF
          -DSTORAGELLM_ENABLE_NATIVE_OPTIMIZE=OFF
          -DSTORAGELLM_ENABLE_TVM_CODEGEN=OFF
          -DSTORAGELLM_ENABLE_CUDA=OFF
          -DSTORAGELLM_ENABLE_CUBLASLT=OFF
          -DSTORAGELLM_ENABLE_CUTLASS=OFF
          -DSTORAGELLM_ENABLE_ROCM=OFF
          -DSTORAGELLM_ENABLE_HIPBLASLT=OFF
          -DSTORAGELLM_ENABLE_CK=OFF
          -DSTORAGELLM_ENABLE_METAL=OFF
          -DSTORAGELLM_ENABLE_ONEDNN=OFF
          -DSTORAGELLM_ENABLE_VULKAN=OFF
          -DSTORAGELLM_ENABLE_OPENCL=OFF
          -DSTORAGELLM_ENABLE_CLBLAST=OFF

      - name: Build JSON parser test only
        run: cmake --build build --target test_json_parser --parallel

      - name: Run JSON parser test only
        run: ctest --test-dir build --output-on-failure -R '^JSONParser$' --timeout 60

      - name: Write final summary
        if: always()
        shell: bash
        run: |
          cat > ci-summary.md <<'EOF'
          # CI Summary

          Copy this block into ChatGPT for follow-up fixes.

          | Check | Result |
          | --- | --- |
          | JSONParser smoke test | ${{ job.status }} |

          This workflow intentionally runs one fast test only:
          `ctest -R '^JSONParser$' --timeout 60`.
          EOF
          cat ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat ci-summary.md

      - name: Upload CI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: ci-summary.md
