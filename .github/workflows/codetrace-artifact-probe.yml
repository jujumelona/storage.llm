name: CodeTrace full artifact schema probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/codetrace_artifact_probe.py'
      - '.github/workflows/codetrace-artifact-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and probe
        run: |
          python -m pip install -q 'datasets>=3.0' 'huggingface_hub>=0.28' zstandard pyarrow
          python -u experiments/codetrace_artifact_probe.py | tee codetrace_artifact_probe.log
          cp codetrace_artifact_probe.log codetrace_artifact_probe/
      - uses: actions/upload-artifact@v4
        with:
          name: CODETRACE_ARTIFACT_PROBE
          path: codetrace_artifact_probe/
          retention-days: 3
