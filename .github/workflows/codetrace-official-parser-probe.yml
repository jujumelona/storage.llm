name: CodeTrace official parser alignment probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/codetrace_official_parser_probe.py'
      - '.github/workflows/codetrace-official-parser-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CodeTracer and probe
        run: |
          python -m pip install -q 'datasets>=3.0' 'huggingface_hub>=0.28' zstandard pyarrow
          python -m pip install -q git+https://github.com/NJU-LINK/CodeTracer.git
          PYTHONPATH=experiments python -u experiments/codetrace_official_parser_probe.py | tee codetrace_official_parser_probe.log
          cp codetrace_official_parser_probe.log codetrace_official_parser_probe/
      - uses: actions/upload-artifact@v4
        with:
          name: CODETRACE_OFFICIAL_PARSER_PROBE
          path: codetrace_official_parser_probe/
          retention-days: 3
