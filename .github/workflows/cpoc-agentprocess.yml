name: Counterfactual Provenance-Obligation Circuit strict falsification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cpoc-agentprocess.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize frozen experiment
        run: |
          echo '' | base64 -d | gzip -d > experiments/cpoc_agentprocess.py
          python -m py_compile experiments/product_lifted_agentprocess.py experiments/product_lifted_agentprocess_v2.py experiments/product_lifted_agentprocess_v3.py experiments/cpoc_agentprocess.py
          sha256sum experiments/cpoc_agentprocess.py | tee /tmp/cpoc_code.sha256
      - name: Acquire AgentProcessBench
        run: |
          python -m pip install -q 'huggingface_hub>=0.28'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='LulaCola/AgentProcessBench',repo_type='dataset',local_dir='/tmp/AgentProcessBench')
          PY
      - name: Run strict falsification
        run: |
          set -euxo pipefail
          rm -rf cpoc_results
          python -u experiments/cpoc_agentprocess.py --data /tmp/AgentProcessBench --out cpoc_results | tee cpoc_results.log
          cp cpoc_results.log cpoc_results/run.log
          cp experiments/cpoc_agentprocess.py cpoc_results/
          cp /tmp/cpoc_code.sha256 cpoc_results/
          cp experiments/product_lifted_agentprocess.py experiments/product_lifted_agentprocess_v2.py experiments/product_lifted_agentprocess_v3.py cpoc_results/
          cat cpoc_results/summary.json
      - name: Determinism replay
        run: |
          set -euxo pipefail
          rm -rf cpoc_replay
          python -u experiments/cpoc_agentprocess.py --data /tmp/AgentProcessBench --out cpoc_replay >/tmp/cpoc_replay.log
          cmp cpoc_results/predictions.csv cpoc_replay/predictions.csv
          cmp cpoc_results/evidence_deletion_witnesses.json cpoc_replay/evidence_deletion_witnesses.json
          python - <<'PY'
          import gzip,json
          a=json.load(gzip.open('cpoc_results/CPOC_SINGLE_CHECKPOINT.json.gz','rt'))
          b=json.load(gzip.open('cpoc_replay/CPOC_SINGLE_CHECKPOINT.json.gz','rt'))
          assert a==b
          sa=json.load(open('cpoc_results/summary.json'));sb=json.load(open('cpoc_replay/summary.json'))
          sa.pop('load_seconds',None);sb.pop('load_seconds',None)
          for x in (sa,sb):
              r=x.get('storage_runtime',{})
              for k in ('indexed_seconds','naive_seconds','speedup'):r.pop(k,None)
          assert sa==sb
          PY
          echo true > cpoc_results/deterministic_replay.txt
      - name: Package
        if: always()
        run: |
          python - <<'PY'
          import pathlib,shutil
          if pathlib.Path('cpoc_results').exists():
              shutil.make_archive('CPOC_AGENTPROCESS_RESULTS','zip','cpoc_results')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CPOC_AGENTPROCESS_RESULTS
          path: |
            CPOC_AGENTPROCESS_RESULTS.zip
            cpoc_results/
          retention-days: 7
