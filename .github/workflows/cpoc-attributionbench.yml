name: CPOC AttributionBench strict falsification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON benchmark client
        run: pip install -q 'datasets==2.19.2' pyarrow
      - name: Switch loader to official subset-balanced JSONL files
        run: |
          python - <<'PY'
          p='experiments/cpoc_attributionbench.py'
          s=open(p).read()
          old="kw=dict(path='osunlp/AttributionBench',name='subset_balanced');return [[dict(x) for x in load_dataset(**kw,split=s)] for s in ('train','test','test_ood')]"
          new="urls={'train':'https://huggingface.co/datasets/osunlp/AttributionBench/resolve/main/train_all_subset_balanced.jsonl','test':'https://huggingface.co/datasets/osunlp/AttributionBench/resolve/main/test_all_subset_balanced.jsonl','test_ood':'https://huggingface.co/datasets/osunlp/AttributionBench/resolve/main/test_ood_all_subset_balanced.jsonl'};return [[dict(x) for x in load_dataset('json',data_files={s:urls[s]},split=s)] for s in ('train','test','test_ood')]"
          assert old in s
          open(p,'w').write(s.replace(old,new))
          PY
          python experiments/cpoc_attributionbench.py --out cpoc_attr_results
      - name: Deterministic replay
        run: |
          python experiments/cpoc_attributionbench.py --out cpoc_attr_replay
          python - <<'PY'
          import json
          a=json.load(open('cpoc_attr_results/summary.json')); b=json.load(open('cpoc_attr_replay/summary.json'))
          a['test'].pop('runtime_seconds',None); b['test'].pop('runtime_seconds',None)
          a['test_ood'].pop('runtime_seconds',None); b['test_ood'].pop('runtime_seconds',None)
          assert a==b
          PY
          diff cpoc_attr_results/test_predictions.jsonl cpoc_attr_replay/test_predictions.jsonl
          diff cpoc_attr_results/ood_predictions.jsonl cpoc_attr_replay/ood_predictions.jsonl
      - name: Package
        run: |
          cp experiments/cpoc_attributionbench.py cpoc_attr_results/
          cp .github/workflows/cpoc-attributionbench.yml cpoc_attr_results/
          sha256sum experiments/cpoc_attributionbench.py > cpoc_attr_results/code.sha256
          zip -qr CPOC_ATTRIBUTIONBENCH_RESULTS.zip cpoc_attr_results
      - uses: actions/upload-artifact@v4
        with:
          name: CPOC_ATTRIBUTIONBENCH_RESULTS
          path: CPOC_ATTRIBUTIONBENCH_RESULTS.zip
          retention-days: 7
