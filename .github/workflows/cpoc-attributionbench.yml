name: CPOC AttributionBench strict falsification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Hub Xet client
        run: pip install -q 'huggingface_hub>=0.27,<1' hf_xet
      - name: Download official JSONL locally and run frozen evaluation
        run: |
          python - <<'PY'
          p='experiments/cpoc_attributionbench.py'
          s=open(p).read()
          old="def load_rows():\n    from datasets import load_dataset\n    kw=dict(path='osunlp/AttributionBench',name='subset_balanced');return [[dict(x) for x in load_dataset(**kw,split=s)] for s in ('train','test','test_ood')]"
          new="""def load_rows():
    from huggingface_hub import hf_hub_download
    names=('train_all_subset_balanced.jsonl','test_all_subset_balanced.jsonl','test_ood_all_subset_balanced.jsonl')
    out=[]
    for name in names:
        fp=hf_hub_download('osunlp/AttributionBench',name,repo_type='dataset')
        with open(fp,encoding='utf-8') as f: out.append([json.loads(line) for line in f if line.strip()])
    return out"""
          assert old in s
          open(p,'w').write(s.replace(old,new))
          PY
          python experiments/cpoc_attributionbench.py --out cpoc_attr_results
      - name: Deterministic replay
        run: |
          python experiments/cpoc_attributionbench.py --out cpoc_attr_replay
          python - <<'PY'
          import json
          a=json.load(open('cpoc_attr_results/summary.json')); b=json.load(open('cpoc_attr_replay/summary.json'))
          a['test'].pop('runtime_seconds',None); b['test'].pop('runtime_seconds',None)
          a['test_ood'].pop('runtime_seconds',None); b['test_ood'].pop('runtime_seconds',None)
          assert a==b
          PY
          diff cpoc_attr_results/test_predictions.jsonl cpoc_attr_replay/test_predictions.jsonl
          diff cpoc_attr_results/ood_predictions.jsonl cpoc_attr_replay/ood_predictions.jsonl
      - name: Package
        run: |
          cp experiments/cpoc_attributionbench.py cpoc_attr_results/
          cp .github/workflows/cpoc-attributionbench.yml cpoc_attr_results/
          sha256sum experiments/cpoc_attributionbench.py > cpoc_attr_results/code.sha256
          zip -qr CPOC_ATTRIBUTIONBENCH_RESULTS.zip cpoc_attr_results
      - uses: actions/upload-artifact@v4
        with:
          name: CPOC_ATTRIBUTIONBENCH_RESULTS
          path: CPOC_ATTRIBUTIONBENCH_RESULTS.zip
          retention-days: 7
