name: Counterfactual Provenance-Obligation Circuit ToolVQA falsification

on:
  pull_request:
    paths:
      - 'experiments/cpoc_toolvqa.py'
      - '.github/workflows/cpoc-toolvqa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-data client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub>=0.34' hf_xet
      - name: Download public ToolVQA train and held-out test
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import shutil, time
          out=Path('cpoc_data');out.mkdir(exist_ok=True)
          for name in ('train.jsonl','test.jsonl'):
              last=None
              for attempt in range(5):
                  try:
                      p=hf_hub_download('DietCoke4671/ToolVQA',name,repo_type='dataset')
                      shutil.copy2(p,out/name)
                      break
                  except Exception as e:
                      last=e;time.sleep(5*(attempt+1))
              else: raise last
          PY
          echo 'f5b42611308af053a9eaf927417cf167eb539763a319fa05a79568b64b281e25  cpoc_data/train.jsonl' | sha256sum -c -
          echo '4986ef5714da0259f8de66179ddeea4361c83642a74ade9d2bb879a4f2b11e20  cpoc_data/test.jsonl' | sha256sum -c -
      - name: Run frozen train-to-test falsification
        run: |
          python -m py_compile experiments/cpoc_toolvqa.py
          python experiments/cpoc_toolvqa.py --train cpoc_data/train.jsonl --test cpoc_data/test.jsonl --out cpoc_results
      - name: Deterministic replay
        run: |
          python experiments/cpoc_toolvqa.py --train cpoc_data/train.jsonl --test cpoc_data/test.jsonl --out cpoc_replay
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('cpoc_results/summary.json').read_text())
          b=json.loads(Path('cpoc_replay/summary.json').read_text())
          for x in (a,b):
              x['runtime'].pop('naive_seconds',None)
              x['runtime'].pop('indexed_seconds',None)
              x['runtime'].pop('speedup',None)
          assert a==b,(a,b)
          assert Path('cpoc_results/contracts.json').read_bytes()==Path('cpoc_replay/contracts.json').read_bytes()
          assert Path('cpoc_results/interventions.jsonl').read_bytes()==Path('cpoc_replay/interventions.jsonl').read_bytes()
          print('DETERMINISTIC_REPLAY_PASS')
          PY
      - name: Package proof artifact
        run: |
          mkdir -p CPOC_TOOLVQA_PROOF/code CPOC_TOOLVQA_PROOF/results
          cp experiments/cpoc_toolvqa.py CPOC_TOOLVQA_PROOF/code/
          cp .github/workflows/cpoc-toolvqa.yml CPOC_TOOLVQA_PROOF/code/
          cp cpoc_results/* CPOC_TOOLVQA_PROOF/results/
          cat > CPOC_TOOLVQA_PROOF/README.txt <<'EOF'
          Counterfactual Provenance-Obligation Circuit strict falsification.

          Public source benchmark: ToolVQA train/test.
          TRACE-Bench is built from ToolVQA, but its reconstructed provenance release was not publicly discoverable at execution time.
          Train contracts are induced only from train.jsonl. Test interventions and all success gates are frozen in code.

          Evaluations:
          - critical evidence deletion vs matched non-critical deletion
          - direct-citation and topology-only baselines
          - minimum internal bridge-cut localization
          - consistent atom-renaming invariance
          - degree/topology-preserving provenance-pointer rewiring
          - compact circuit storage
          - cached circuit vs full rebuild runtime with exact output equality

          No embeddings, dense latent vectors, pretrained encoders, LLM calls, TF-IDF, SVD, nearest-vector retrieval, code generation, or external solver.
          EOF
          sha256sum CPOC_TOOLVQA_PROOF/code/* CPOC_TOOLVQA_PROOF/results/* > CPOC_TOOLVQA_PROOF/SHA256SUMS.txt
          zip -qr CPOC_TOOLVQA_PROOF.zip CPOC_TOOLVQA_PROOF
      - uses: actions/upload-artifact@v4
        with:
          name: CPOC_TOOLVQA_PROOF
          path: CPOC_TOOLVQA_PROOF.zip
          retention-days: 7
