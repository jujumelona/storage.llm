name: Product-Lifted Obligation Graph CodeTrace blind transfer

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/product_lifted_codetrace_blind.py'
      - '.github/workflows/product-lifted-codetrace-blind.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and acquire frozen source benchmark
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install -q 'datasets>=3.0' 'huggingface_hub>=0.28' pyarrow
          python - <<'PY'
          from huggingface_hub import snapshot_download
          print(snapshot_download(repo_id='LulaCola/AgentProcessBench', repo_type='dataset', local_dir='/tmp/AgentProcessBench'))
          PY
      - name: Prepare sealed CodeTrace labels and blind instances
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile experiments/product_lifted_codetrace_blind.py
          rm -rf codetrace_prepare codetrace_results codetrace_replay
          PYTHONPATH=experiments python -u experiments/product_lifted_codetrace_blind.py prepare --out codetrace_prepare \
            | tee codetrace_prepare.log
          mkdir -p /tmp/codetrace_blind
          cp codetrace_prepare/blind_instances.jsonl /tmp/codetrace_blind/blind_instances.jsonl
          test ! -e /tmp/codetrace_blind/labels_sealed.json
          sha256sum codetrace_prepare/labels_sealed.json codetrace_prepare/blind_instances.jsonl > codetrace_prepare/PREPARE_HASHES.txt
      - name: Blind prediction without step labels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p codetrace_results
          PYTHONPATH=experiments python -u experiments/product_lifted_codetrace_blind.py predict \
            --source /tmp/AgentProcessBench \
            --blind /tmp/codetrace_blind/blind_instances.jsonl \
            --out codetrace_results/blind_predictions_prelabel.json \
            | tee codetrace_results/predict.log
          cp experiments/product_lifted_codetrace_blind.py codetrace_results/
          cp experiments/product_lifted_agentprocess.py codetrace_results/
          cp experiments/product_lifted_agentprocess_v2.py codetrace_results/
          cp codetrace_prepare/prepare_manifest.json codetrace_results/
          cp codetrace_prepare/PREPARE_HASHES.txt codetrace_results/
          sha256sum codetrace_results/blind_predictions_prelabel.json experiments/product_lifted_codetrace_blind.py \
            > codetrace_results/PRE_LABEL_HASHES.txt
      - name: Deterministic blind replay
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p codetrace_replay
          PYTHONPATH=experiments python -u experiments/product_lifted_codetrace_blind.py predict \
            --source /tmp/AgentProcessBench \
            --blind /tmp/codetrace_blind/blind_instances.jsonl \
            --out codetrace_replay/blind_predictions_prelabel.json \
            >/tmp/codetrace_replay.log
          cmp codetrace_results/blind_predictions_prelabel.json codetrace_replay/blind_predictions_prelabel.json
          cmp codetrace_results/blind_predictions_prelabel.json.sha256 codetrace_replay/blind_predictions_prelabel.json.sha256
          echo true > codetrace_results/deterministic_replay.txt
      - name: Open sealed labels only after predictions
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=experiments python -u experiments/product_lifted_codetrace_blind.py evaluate \
            --predictions codetrace_results/blind_predictions_prelabel.json \
            --labels codetrace_prepare/labels_sealed.json \
            --out codetrace_results \
            | tee codetrace_results/evaluate.log
          cp codetrace_prepare/labels_sealed.json codetrace_results/labels_sealed_after_prediction.json
          cat codetrace_results/summary.json
      - name: Package
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive('PRODUCT_LIFTED_CODETRACE_BLIND_RESULTS','zip','codetrace_results')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PRODUCT_LIFTED_CODETRACE_BLIND_RESULTS
          path: |
            PRODUCT_LIFTED_CODETRACE_BLIND_RESULTS.zip
            codetrace_results/
          retention-days: 7
