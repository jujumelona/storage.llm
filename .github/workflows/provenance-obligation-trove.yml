name: Counterfactual Provenance Obligation TROVE falsification

on:
  pull_request:
    paths:
      - 'experiments/provenance_obligation_trove.py'
      - '.github/workflows/provenance-obligation-trove.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Acquire official TROVE dataset
        run: |
          python -m pip install -q gdown
          gdown --fuzzy 'https://drive.google.com/file/d/1bbTpKgwZXePRYCoIcbvsVccNErQfisLt/view?usp=sharing' -O trove_dataset.bin
          test $(wc -c < trove_dataset.bin) -gt 1000000
          mkdir -p TROVE_DATA
          python - <<'PY'
          import shutil,zipfile,tarfile
          from pathlib import Path
          p=Path('trove_dataset.bin');out=Path('TROVE_DATA')
          if zipfile.is_zipfile(p):
              with zipfile.ZipFile(p) as z:z.extractall(out)
          elif tarfile.is_tarfile(p):
              with tarfile.open(p) as t:t.extractall(out)
          else:
              raise RuntimeError('Unknown TROVE archive format')
          print('jsonl',len(list(out.rglob('*.jsonl'))),'bytes',p.stat().st_size)
          PY
          test $(find TROVE_DATA -name '*.jsonl' | wc -l) -ge 1

      - name: Seal provenance links before prediction
        run: |
          mkdir -p prepared sealed
          python experiments/provenance_obligation_trove.py prepare --root TROVE_DATA --out prepared
          mv prepared/labels_sealed.json sealed/labels_sealed.json
          sha256sum prepared/blind.jsonl sealed/labels_sealed.json > sealed/input_hashes.txt
          rm -rf TROVE_DATA trove_dataset.bin

      - name: Blind structural prediction and deterministic replay
        run: |
          mkdir -p run_a run_b
          cp prepared/blind.jsonl run_a/blind.jsonl
          cp prepared/blind.jsonl run_b/blind.jsonl
          python experiments/provenance_obligation_trove.py predict --blind run_a/blind.jsonl --out run_a/predictions.json
          python experiments/provenance_obligation_trove.py predict --blind run_b/blind.jsonl --out run_b/predictions.json
          python - <<'PY'
          import json
          a=json.load(open('run_a/predictions.json'));b=json.load(open('run_b/predictions.json'))
          assert a['predictions']==b['predictions']
          assert a['storage_runtime']['outputs_identical'] is True
          assert b['storage_runtime']['outputs_identical'] is True
          print('deterministic structural outputs: PASS')
          PY

      - name: Open sealed labels and evaluate
        run: |
          mkdir -p results
          cp run_a/predictions.json run_a/predictions.json.sha256 results/
          python experiments/provenance_obligation_trove.py evaluate \
            --pred results/predictions.json --labels sealed/labels_sealed.json --outdir results
          cp prepared/prepare_manifest.json sealed/input_hashes.txt results/
          cp experiments/provenance_obligation_trove.py results/model_wrapper.py
          python - <<'PY'
          import ast,base64,re,zlib
          from pathlib import Path
          s=Path('experiments/provenance_obligation_trove.py').read_text()
          m=re.search(r"b64decode\((['\"])(.*?)\1\)",s,re.S)
          if m:Path('results/model_source.py').write_bytes(zlib.decompress(base64.b64decode(ast.literal_eval(m.group(1)+m.group(2)+m.group(1)))))
          PY
          python -m py_compile results/model_source.py
          cat results/summary.json

      - name: Package evidence
        run: |
          cd results
          zip -9 -r ../COUNTERFACTUAL_PROVENANCE_OBLIGATION_TROVE_RESULTS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: COUNTERFACTUAL_PROVENANCE_OBLIGATION_TROVE_RESULTS
          path: COUNTERFACTUAL_PROVENANCE_OBLIGATION_TROVE_RESULTS.zip
          retention-days: 7
