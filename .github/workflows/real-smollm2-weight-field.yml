# validation trigger: strict v5
name: Real SmolLM2 Weight-Field Validation

on:
  push:
    paths:
      - ".github/workflows/real-smollm2-weight-field.yml"
      - "experiments/real_smollm2_weight_field.py"
      - "experiments/real_smollm2_weight_field_v2.py"
      - "experiments/real_smollm2_weight_field_v3_blind.py"
      - "experiments/real_smollm2_weight_field_v4_structural_blind.py"
      - "experiments/real_smollm2_v5_strict.py"
  pull_request:
    paths:
      - ".github/workflows/real-smollm2-weight-field.yml"
      - "experiments/real_smollm2_weight_field.py"
      - "experiments/real_smollm2_weight_field_v2.py"
      - "experiments/real_smollm2_weight_field_v3_blind.py"
      - "experiments/real_smollm2_weight_field_v4_structural_blind.py"
      - "experiments/real_smollm2_v5_strict.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: python -m pip install --upgrade pip && python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install validation dependencies
        run: python -m pip install transformers==4.48.3 datasets==3.2.0 accelerate==1.3.0 safetensors==0.5.2 sentencepiece

      - name: Cache Hugging Face models and datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: smollm2-135m-real-weight-field-v5

      - name: Run strict independent validation
        shell: bash
        run: |
          mkdir -p out/real_smollm2_v5_strict
          set -o pipefail
          python experiments/real_smollm2_v5_strict.py 2>&1 | tee out/real_smollm2_v5_strict/RUN.log

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-smollm2-v5-strict-results
          path: out/real_smollm2_v5_strict
          if-no-files-found: warn
          retention-days: 7
