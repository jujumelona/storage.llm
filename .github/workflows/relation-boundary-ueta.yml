name: Relation-Boundary-UETA TraceElephant falsification

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cueta_traceelephant_eval.py'
      - 'experiments/boundary_ueta_traceelephant.py'
      - 'experiments/relation_boundary_ueta.py'
      - '.github/workflows/relation-boundary-ueta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire TraceElephant
        run: |
          python -m pip install -q 'huggingface_hub>=0.28'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='TraceElephant/TraceElephant',repo_type='dataset',local_dir='/tmp/TraceElephantData')
          PY
      - name: Run Relation-Boundary-UETA
        run: |
          set -euxo pipefail
          rm -rf relation_boundary_ueta_results
          python -u experiments/relation_boundary_ueta.py --data /tmp/TraceElephantData --out relation_boundary_ueta_results | tee relation_boundary_ueta_results.log
          cp relation_boundary_ueta_results.log relation_boundary_ueta_results/run.log
          cp experiments/relation_boundary_ueta.py relation_boundary_ueta_results/
          cp experiments/boundary_ueta_traceelephant.py relation_boundary_ueta_results/
          cp experiments/cueta_traceelephant_eval.py relation_boundary_ueta_results/
          cat relation_boundary_ueta_results/summary.json
      - name: Package
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive('RELATION_BOUNDARY_UETA_RESULTS','zip','relation_boundary_ueta_results')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RELATION_BOUNDARY_UETA_RESULTS
          path: |
            RELATION_BOUNDARY_UETA_RESULTS.zip
            relation_boundary_ueta_results/
          retention-days: 7
