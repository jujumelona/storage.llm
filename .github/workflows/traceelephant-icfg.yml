name: TraceElephant sparse causal contrast

on:
  push:
    branches:
      - traceelephant-causal-pilot-20260719
    paths:
      - 'experiments/traceelephant_icfg/**'
      - '.github/workflows/traceelephant-icfg.yml'
  pull_request:
    paths:
      - 'experiments/traceelephant_icfg/**'
      - '.github/workflows/traceelephant-icfg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_XET_HIGH_PERFORMANCE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      EXPECTED_SHA256: 8e5df3e402abfa6666ae1b656a5d516395134163774b5da1a3abae99cb83a582
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public dataset client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub>=0.30' hf_xet
      - name: Download official TraceElephant data.zip
        run: |
          mkdir -p .cache/traceelephant
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(
              repo_id='TraceElephant/TraceElephant',
              filename='data.zip',
              repo_type='dataset',
              local_dir='.cache/traceelephant',
          )
          print(p)
          PY
          sha256sum .cache/traceelephant/data.zip
          echo "$EXPECTED_SHA256  .cache/traceelephant/data.zip" | sha256sum -c -
      - name: Run target-blind sparse structural attribution
        run: |
          rm -rf results
          python experiments/traceelephant_icfg/traceelephant_icfg.py \
            --zip .cache/traceelephant/data.zip \
            --out results \
            --expected-sha256 "$EXPECTED_SHA256" | tee run.log
      - name: Package result-only artifact
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          out = Path('results')
          with zipfile.ZipFile('TRACEELEPHANT_ICFG_RESULTS_ONLY.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(out.glob('*')):
                  if p.is_file():
                      z.write(p, p.name)
              for p in [Path('run.log'), Path('experiments/traceelephant_icfg/traceelephant_icfg.py')]:
                  if p.exists():
                      z.write(p, p.name)
          PY
      - name: Upload result-only artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceelephant-icfg-results
          path: |
            TRACEELEPHANT_ICFG_RESULTS_ONLY.zip
            results/
            run.log
          if-no-files-found: warn
          retention-days: 14
