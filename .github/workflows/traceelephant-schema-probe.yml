name: TraceElephant schema probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/traceelephant-schema-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire TraceElephant
        run: |
          python -m pip install -q 'huggingface_hub>=0.28'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='TraceElephant/TraceElephant',repo_type='dataset',local_dir='/tmp/TraceElephantData')
          PY
      - name: Export schema-only samples
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          sys.path.insert(0,'experiments')
          import cueta_traceelephant_eval as ce
          root=pathlib.Path('/tmp/TraceElephantData');ce.unpack(root);ce.unpack(root)
          out=pathlib.Path('traceelephant_schema_probe');out.mkdir(exist_ok=True)
          found=[]
          for mp in root.rglob('trace_metadata.json'):
            try:m=json.load(open(mp))
            except:continue
            inferred=str(m.get('system_name') or mp.parents[1].name).lower()
            if 'swe' not in inferred and 'swe' not in str(mp).lower():continue
            sp=mp.parent/'step_records.json'
            if not sp.exists():continue
            steps=json.load(open(sp))
            def clean(x,d=0):
              if d>8:return '<depth>'
              if isinstance(x,dict):return {str(k):clean(v,d+1) for k,v in x.items()}
              if isinstance(x,list):return [clean(v,d+1) for v in x[:30]]
              s=str(x);s=re.sub(r'[0-9a-f]{12,}','<id>',s,flags=re.I);return s[:6000]
            rec={'system_name':m.get('system_name'),'inferred_system':inferred,'num_steps':len(steps),'steps':clean(steps[:30])}
            (out/f'swe_sample_{len(found)}.json').write_text(json.dumps(rec,indent=2))
            found.append(str(mp.parent))
            if len(found)>=2:break
          (out/'manifest.json').write_text(json.dumps(found,indent=2))
          if len(found)<2:raise RuntimeError(found)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TRACEELEPHANT_SCHEMA_PROBE
          path: traceelephant_schema_probe/
          retention-days: 3
