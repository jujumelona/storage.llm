name: Non-dense natural reasoning V5

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/nondense_natural_v5.py'
      - '.github/workflows/trail-nondense-full-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire public benchmarks
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Mihir3009/LogicBench.git /tmp/LogicBench
          git clone --depth 1 https://github.com/lgw863/LogiQA-dataset.git /tmp/LogiQA-dataset
      - name: Run V5 natural reasoning
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf nondense_natural_v5_results
          python -u experiments/nondense_natural_v5.py \
            --logicbench /tmp/LogicBench \
            --logiqa /tmp/LogiQA-dataset \
            --out nondense_natural_v5_results | tee nondense_natural_v5_results.log
          cp nondense_natural_v5_results.log nondense_natural_v5_results/run.log
          cat nondense_natural_v5_results/summary.json
      - name: Package results
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive('NONDENSE_NATURAL_V5_RESULTS','zip','nondense_natural_v5_results')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NONDENSE_NATURAL_V5_RESULTS
          path: |
            NONDENSE_NATURAL_V5_RESULTS.zip
            nondense_natural_v5_results/
          retention-days: 7
