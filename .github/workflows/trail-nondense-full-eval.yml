name: Export non-dense reasoning benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/trail-nondense-full-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Acquire public benchmarks
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/Mihir3009/LogicBench.git /tmp/LogicBench
          git clone --depth 1 https://github.com/lgw863/LogiQA-dataset.git /tmp/LogiQA-dataset
          rm -rf /tmp/LogicBench/.git /tmp/LogiQA-dataset/.git
      - name: Package benchmark sources
        shell: bash
        run: |
          mkdir -p benchmark_sources
          cp -a /tmp/LogicBench benchmark_sources/
          cp -a /tmp/LogiQA-dataset benchmark_sources/
          python - <<'PY'
          import shutil
          shutil.make_archive('NONDENSE_BENCHMARK_SOURCES','zip','benchmark_sources')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NONDENSE_BENCHMARK_SOURCES
          path: NONDENSE_BENCHMARK_SOURCES.zip
          retention-days: 7
