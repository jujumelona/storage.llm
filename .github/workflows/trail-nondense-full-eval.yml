name: TRAIL non-dense full evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/trail_nondense_full_eval.py'
      - 'experiments/trail_nondense_ultra_runner.py'
      - 'experiments/trail_nondense_v3_runner.py'
      - '.github/workflows/trail-nondense-full-eval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire public benchmarks
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/patronus-ai/trail-benchmark.git /tmp/trail-benchmark
          git clone --depth 1 https://github.com/Mihir3009/LogicBench.git /tmp/LogicBench
          git clone --depth 1 https://github.com/lgw863/LogiQA-dataset.git /tmp/LogiQA-dataset
      - name: Run strict non-dense evaluation
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf trail_nondense_results
          python -u experiments/trail_nondense_v3_runner.py \
            --trail /tmp/trail-benchmark \
            --logicbench /tmp/LogicBench \
            --logiqa /tmp/LogiQA-dataset \
            --out trail_nondense_results | tee trail_nondense_results.log
          cat trail_nondense_results/summary.json
          cp trail_nondense_results.log trail_nondense_results/run.log
      - name: Package result bundle
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive('TRAIL_NONDENSE_V3_RESULTS', 'zip', 'trail_nondense_results')
          PY
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRAIL_NONDENSE_V3_RESULTS
          path: |
            TRAIL_NONDENSE_V3_RESULTS.zip
            trail_nondense_results/
          retention-days: 7
