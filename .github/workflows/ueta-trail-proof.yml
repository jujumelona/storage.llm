name: UETA TRAIL strict falsification

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ueta_trail_eval.py'
      - '.github/workflows/ueta-trail-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Acquire TRAIL
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/patronus-ai/trail-benchmark.git /tmp/trail-benchmark
      - name: Run UETA strict evaluation
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ueta_trail_results
          python -u experiments/ueta_trail_eval.py \
            --trail /tmp/trail-benchmark \
            --out ueta_trail_results | tee ueta_trail_results.log
          cp ueta_trail_results.log ueta_trail_results/run.log
          cat ueta_trail_results/summary.json
      - name: Package results
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive('UETA_TRAIL_STRICT_RESULTS','zip','ueta_trail_results')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UETA_TRAIL_STRICT_RESULTS
          path: |
            UETA_TRAIL_STRICT_RESULTS.zip
            ueta_trail_results/
          retention-days: 7
